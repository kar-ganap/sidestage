# Fly deploy config. See docs/DECISIONS.md D-25 and D-31.
#
# `fly launch --no-deploy` may rename the app if "sidestage" is taken; that is
# fine, just keep the name it picks.

app = "sidestage"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true

  # D-25: a reviewer opens this URL cold, exactly once. Fly's default is to
  # auto-stop idle machines, which would hand them a cold start and read as
  # "broken". Keeping one machine warm is the entire reason this is here.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # EXACTLY one machine, and this is a correctness constraint rather than a
  # cost one. The operator session (app/session.py) holds the chat log, the
  # queue and the ledger in process (D-33: reads are in memory). With two
  # machines behind the load balancer a reviewer's POST /api/chat and their
  # next GET /api/state can land on different instances, and the queue appears
  # to empty at random. `min_machines_running` is a floor, not a ceiling —
  # keep the count pinned with `fly scale count 1`.
  max_machines_running = 1

  processes = ["app"]

# D-31: no [[mounts]] block. The database is ephemeral and reseeded from
# data/*.json at boot, so every reviewer gets identical deterministic state.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
