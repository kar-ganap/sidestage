<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideStage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<div id="root"><div class="boot">starting…</div></div>

<!-- Required, not optional. preact/hooks does `import {options} from "preact"`
     — a bare specifier the browser cannot resolve on its own, so without this
     map the module fails to load and the console renders nothing but "starting…".
     Versions are pinned: an unpinned CDN import is a silent dependency on
     whatever shipped this morning. -->
<script type="importmap">
{
  "imports": {
    "preact": "https://cdn.jsdelivr.net/npm/preact@10.23.2/dist/preact.module.js",
    "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.23.2/hooks/dist/hooks.module.js",
    "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js"
  }
}
</script>
<script type="module" src="/console.js"></script>
<noscript><div class="boot">This console needs JavaScript.</div></noscript>
</body>
</html>
