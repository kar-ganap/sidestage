<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideStage</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.5 ui-monospace, Menlo, monospace;
    background: #15181b; color: #e8e7e2;
  }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 22px; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 6px; }
  p { color: #9aa0a0; margin: 0 0 18px; }
  pre {
    text-align: left; background: #1d2126; border: 1px solid #2e3439;
    padding: 14px 16px; border-radius: 3px; font-size: 13px; overflow-x: auto;
  }
  a { color: #7ea6c9; }
</style>
</head>
<body>
<main>
  <h1>SideStage</h1>
  <p>Live-selling copilot &middot; scaffold running</p>
  <pre id="health">checking /healthz&hellip;</pre>
  <p><a href="/api/docs">API docs</a></p>
</main>
<script>
  fetch("/healthz")
    .then(function (r) { return r.json(); })
    .then(function (j) {
      document.getElementById("health").textContent = JSON.stringify(j, null, 2);
    })
    .catch(function (e) {
      document.getElementById("health").textContent = "healthz failed: " + e;
    });
</script>
</body>
</html>
